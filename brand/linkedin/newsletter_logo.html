<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:linear-gradient(135deg,#A88329 0%,#B18B2D 8%,#C09934 17%,#CFAC49 25%,#DEC163 33%,#EDD77E 42%,#F7E590 50%,#ECD57B 58%,#DEC161 67%,#D0AD48 75%,#C29B36 83%,#B28C2D 92%,#A88228 100%)}
body{width:1200px;height:1200px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#ffffff 0%,#fdfbf5 45%,#f5eedc 100%)}
.bar{position:absolute;left:0;right:0;height:26px;background:var(--gold)}
.frame{position:absolute;inset:64px;padding:2px;background:var(--gold)}
.frame>div{width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#fdfbf5 50%,#f8f2e3 100%)}
.in{position:absolute;inset:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
img{width:760px;display:block}
.rule{width:560px;height:3px;background:var(--gold);margin:64px 0 44px}
.t{font:600 104px/1 'Cormorant Garamond',serif;color:#16243f;letter-spacing:-.5px}
.k{font:600 27px/1 'IBM Plex Mono',monospace;letter-spacing:.34em;color:#8a6514;margin-top:40px;text-transform:uppercase}
</style></head><body>
<div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div>
<div class="frame"><div></div></div>
<div class="in"><img src="../rockit-logo.svg"><div class="rule"></div><div class="t">The Rockit Manifest</div><div class="k">Weekly · From Cairo</div></div>
</body></html>
